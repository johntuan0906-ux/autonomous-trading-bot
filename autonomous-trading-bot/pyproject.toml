[project]
name = "autonomous-trading-bot"
version = "1.0.0"
description = "Autonomous Binance Futures USDT-M trading bot — Single Best Setup + ATR risk + Macro sentiment"
requires-python = ">=3.10"
dependencies = [
  "ccxt>=4.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "feedparser>=6.0",
  "vaderSentiment>=3.3",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
